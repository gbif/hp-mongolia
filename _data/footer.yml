# Footer configuration
# You should create one of these files for each language you support. E.g. /_data/es/footer.yml for the spanish version of the footer
# Footer content is organized in columns.
# You can also add a small print license statement at the bottom.

# Columns (the more you add, the narrower they will be)
columns:
  - name: Useful information
    links:
      - text: About GBIF Mongolia
        href: https://www.gbif.org/country/MN/summary
      - text: About GBIF
        href: https://www.gbif.org/what-is-gbif
      - text: Institute of Biology, MAS
        href: https://biology.ac.mn/

  - name: Publish biodiversity data
    links:
      - text: Become a GBIF Publisher
        href: https://www.gbif.org/publishing-data
      - text: IPT Mongolia
        href: https://ipt.gbif.mn/
      - text: GBIF Data
        href: https://www.gbif.org/occurrence/search
      - text: GBIF Data Use
        href: https://www.gbif.org/terms/data-use

  - name: GBIF Mongolia
    description: |
